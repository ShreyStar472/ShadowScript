    <style>
    /* ===== ShadowScript Website CSS ===== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #080d1b, #111b32, #071a29);
    color: #f1f5f9;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    text-align: center;
}

/* Header */
header {
    padding: 35px 20px;
    background: rgba(10, 20, 40, 0.8);
    border-bottom: 1px solid rgba(0, 255, 220, 0.25);
    box-shadow: 0 5px 25px rgba(0, 255, 220, 0.08);
}

h1 {
    color: #83e8d1;
    font-size: clamp(28px, 4vw, 44px);
    letter-spacing: 1px;
    text-shadow: 0 0 18px rgba(0, 255, 220, 0.3);
}

/* Main content */
main {
    width: min(90%, 750px);
    margin: 55px auto;
    padding: 40px 25px;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(131, 232, 209, 0.2);
    border-radius: 24px;
    box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
}

/* Horizontal lines */
hr {
    border: none;
    height: 1px;
    background: linear-gradient(
        to right,
        transparent,
        #83e8d1,
        #60a5fa,
        transparent
    );
    margin: 25px 0;
}

/* ShadowScript logo */
img {
    width: 200px;
    height: 200px;
    object-fit: contain;
    border-radius: 25px;
    margin: 15px 0;
    filter: drop-shadow(0 0 20px rgba(0, 255, 220, 0.18));
    transition: transform 0.35s ease, filter 0.35s ease;
}

img:hover {
    transform: scale(1.08) rotate(-2deg);
    filter: drop-shadow(0 0 25px rgba(0, 255, 220, 0.5));
}

/* Download button */
a {
    display: inline-block;
    margin: 15px 0 5px;
    padding: 16px 32px;
    background: linear-gradient(135deg, #00d9b5, #38a9ff);
    color: #07111e;
    text-decoration: none;
    font-size: 17px;
    font-weight: 700;
    border-radius: 12px;
    box-shadow: 0 6px 25px rgba(0, 217, 181, 0.2);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
}

a:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 35px rgba(0, 217, 181, 0.4);
}

a:active {
    transform: scale(0.97);
}

/* Footer */
footer {
    margin-top: auto;
    padding: 25px 15px;
    background: rgba(4, 9, 20, 0.8);
    border-top: 1px solid rgba(131, 232, 209, 0.2);
    color: #a9b8cc;
    font-size: 13px;
    line-height: 2;
}

/* Mobile screens */
@media (max-width: 600px) {
    header {
        padding: 28px 15px;
    }

    main {
        margin: 30px auto;
        padding: 25px 15px;
    }

    img {
        width: 160px;
        height: 160px;
    }

    a {
        max-width: 100%;
        padding: 14px 22px;
        font-size: 16px;
    }

    footer {
        font-size: 12px;
    }
}
</style>
